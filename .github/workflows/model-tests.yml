name: Kronos Model Imports

on:
  push:
    branches: [main]
    paths:
      - 'app/services/kronos_model/**'
      - 'app/services/kronos_predict_service.py'
      - 'app/services/first_limit_alpha_service.py'
      - 'strategy/first_limit_alpha/train_sequence.py'
      - 'tests/test_first_limit_alpha.py'
      - 'requirements*.txt'
      - '.github/workflows/model-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/services/kronos_model/**'
      - 'app/services/kronos_predict_service.py'
      - 'app/services/first_limit_alpha_service.py'
      - 'strategy/first_limit_alpha/train_sequence.py'
      - 'tests/test_first_limit_alpha.py'
      - 'requirements*.txt'
      - '.github/workflows/model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronos-imports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import-model-runtime:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install model runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r requirements-kronos.txt
          pip check

      - name: Import Kronos runtime
        run: |
          python - <<'PY'
          from app.services.kronos_model import Kronos, KronosPredictor, KronosTokenizer

          assert Kronos is not None
          assert KronosPredictor is not None
          assert KronosTokenizer is not None
          print("Kronos runtime imports: ok")
          PY

      - name: Test Torch sequence training
        run: python -m pytest tests/test_first_limit_alpha.py -q -k sequence
