name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip check

      - name: Start API for regression tests
        env:
          ENABLE_TUSHARE: "false"
          ENABLE_LIVE_MARKET_DATA: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18890 > /tmp/alpha-api.log 2>&1 &
          echo $! > /tmp/alpha-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18890/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alpha-api.log
          exit 1

      - name: Run tests
        run: python -m pytest -q

      - name: Show API log on failure
        if: failure()
        run: tail -n 200 /tmp/alpha-api.log || true
