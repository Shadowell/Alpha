name: Playwright E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly at 18:00 UTC (02:00 Asia/Shanghai).
    - cron: '0 18 * * *'
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser smoke tests
    # PR runs only when the `run-e2e` label is applied (nightly and manual runs
    # always execute).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-e2e'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip check

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start API
        env:
          ENABLE_TUSHARE: "false"
          ENABLE_LIVE_MARKET_DATA: "false"
          ALPHA_EDGE_EXPOSURE: "loopback"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18890 > /tmp/alpha-e2e-api.log 2>&1 &
          echo $! > /tmp/alpha-e2e-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18890/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alpha-e2e-api.log
          exit 1

      - name: Run Playwright E2E
        working-directory: tests/e2e
        env:
          ALPHA_TEST_BASE_URL: "http://127.0.0.1:18890"
        run: npx playwright test --config=playwright.config.js

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore

      - name: Show API log on failure
        if: failure()
        run: tail -n 200 /tmp/alpha-e2e-api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/alpha-e2e-api.pid)" 2>/dev/null || true
