services:
  alpha:
    build: .
    image: alpha:latest
    container_name: alpha
    # 安全默认：仅本机可访问。如需局域网/外网访问，改为 "18888:18888"
    # 并务必配置鉴权（当前版本 API 无鉴权，见 README「安全提示」）。
    ports:
      - "127.0.0.1:18888:18888"
    env_file:
      - .env
    environment:
      # 容器内必须绑 0.0.0.0（宿主机暴露面由上面的端口映射控制）
      HOST: 0.0.0.0
      PORT: "18888"
      # 写防护适配：经 docker-proxy NAT 后容器内看不到真实来源 IP，
      # 信任宿主机的端口绑定（默认仅 127.0.0.1）作为访问边界。
      # ⚠️ 若把端口映射改为 "18888:18888" 暴露到局域网，请删除此项并改配 ALPHA_WRITE_TOKEN。
      ALPHA_TRUST_EDGE: "1"
    volumes:
      # ⚠️ 数据库必须放命名卷（VM 内 ext4）：macOS VirtioFS bind mount 上的
      # SQLite WAL 在容器强杀/宿主机并发访问下会页级损坏（已两次实测）。
      # 宿主机需要取数据时用 `docker compose cp alpha:/app/data/xxx .`，
      # 禁止在容器运行期间从宿主机直接读写卷内 DB 文件。
      - alpha_data:/app/data
      - ./logs:/app/logs
      # Kronos 模型权重缓存持久化（否则每次重建容器都重新下载 ~300MB）
      - alpha_hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18888/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  alpha_data:
    name: alpha_data # 固定卷名（已迁入 5.19M 行K线数据），避免 compose 加项目前缀生成空卷
  alpha_hf_cache:
